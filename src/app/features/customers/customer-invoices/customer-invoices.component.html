<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Facturas del Cliente</mat-card-title>
      <div class="spacer"></div>
      <button mat-raised-button color="primary" (click)="addInvoice()">
        <mat-icon>add</mat-icon>
        Nueva Factura
      </button>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Cargando facturas...</p>
      </div>

      <div *ngIf="!isLoading">
        <table mat-table [dataSource]="invoices" class="mat-elevation-z8">
          <ng-container matColumnDef="invoiceNumber">
            <th mat-header-cell *matHeaderCellDef>Número de Factura</th>
            <td mat-cell *matCellDef="let invoice">{{invoice.invoiceNumber}}</td>
          </ng-container>

          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Fecha</th>
            <td mat-cell *matCellDef="let invoice">{{invoice.date | date:'dd/MM/yyyy'}}</td>
          </ng-container>

          <ng-container matColumnDef="total">
            <th mat-header-cell *matHeaderCellDef>Total</th>
            <td mat-cell *matCellDef="let invoice">{{invoice.total | currency}}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let invoice">
              <mat-chip [color]="invoice.status === 'PAID' ? 'primary' : 'warn'" selected>
                {{invoice.status === 'PAID' ? 'Pagada' : 'Pendiente'}}
              </mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let invoice">
              <button mat-icon-button color="primary" (click)="editInvoice(invoice)" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="accent" (click)="viewInvoice(invoice)" matTooltip="Ver Detalles">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteInvoice(invoice)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
