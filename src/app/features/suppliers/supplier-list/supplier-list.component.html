<mat-card>
  <mat-card-header>
    <mat-card-title>Lista de Proveedores</mat-card-title>
    <div class="spacer"></div>
    <button mat-raised-button color="primary" (click)="onAddSupplier()">
      <mat-icon>add</mat-icon>
      Agregar Proveedor
    </button>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="suppliers" class="mat-elevation-z8">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let supplier">{{supplier.code}}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let supplier">{{supplier.name}}</td>
      </ng-container>

      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef>Contacto</th>
        <td mat-cell *matCellDef="let supplier">{{supplier.contactName}}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let supplier">{{supplier.email}}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let supplier">{{supplier.phone}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let supplier">
          <button mat-icon-button color="primary" matTooltip="Editar" (click)="onEditSupplier(supplier)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="accent" matTooltip="Ver Órdenes" (click)="onViewOrders(supplier)">
            <mat-icon>shopping_cart</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="onDeleteSupplier(supplier)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
