<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Órdenes de Compra - {{supplier?.name}}</mat-card-title>
      <div class="spacer"></div>
      <button mat-raised-button color="primary" (click)="onAddOrder()">
        <mat-icon>add</mat-icon>
        Crear Orden
      </button>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="orders" class="mat-elevation-z8">
        <ng-container matColumnDef="orderNumber">
          <th mat-header-cell *matHeaderCellDef>Número de Orden</th>
          <td mat-cell *matCellDef="let order">{{order.orderNumber}}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let order">{{order.date | date}}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let order">
            <span [class]="'status-badge ' + order.status">{{order.status}}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let order">{{order.total | currency}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let order">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="onEditOrder(order)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="accent" matTooltip="Ver" (click)="onViewOrder(order)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="onDeleteOrder(order)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="onAddOrder()">
        <mat-icon>add</mat-icon>
        Nueva Orden
      </button>
    </mat-card-actions>
  </mat-card>
</div>
