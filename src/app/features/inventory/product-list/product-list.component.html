<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Productos</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="products" class="mat-elevation-z8">
        <ng-container matColumnDef="sku">
          <th mat-header-cell *matHeaderCellDef>SKU</th>
          <td mat-cell *matCellDef="let product">{{product.sku}}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let product">{{product.name}}</td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Categoría</th>
          <td mat-cell *matCellDef="let product">{{product.category}}</td>
        </ng-container>

        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let product">{{product.currentStock}}</td>
        </ng-container>

        <ng-container matColumnDef="unitPrice">
          <th mat-header-cell *matHeaderCellDef>Precio Unitario</th>
          <td mat-cell *matCellDef="let product">{{product.unitPrice | currency}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let product">
            <button mat-icon-button color="primary" [routerLink]="['/products', product.id, 'edit']" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="accent" [routerLink]="['/products', product.id, 'batches']" matTooltip="Gestionar Lotes">
              <mat-icon>inventory</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="onDeleteProduct(product)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" [routerLink]="['/products/new']">
        <mat-icon>add</mat-icon>
        Agregar Producto
      </button>
    </mat-card-actions>
  </mat-card>
</div>
