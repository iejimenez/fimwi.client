<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Gestión de Lotes - {{product?.name}}</mat-card-title>
      <div class="spacer"></div>
      <button mat-raised-button color="primary" (click)="onAddBatch()">
        <mat-icon>add</mat-icon>
        Agregar Lote
      </button>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="batches" class="mat-elevation-z8">
        <ng-container matColumnDef="batchNumber">
          <th mat-header-cell *matHeaderCellDef>Número de Lote</th>
          <td mat-cell *matCellDef="let batch">{{batch.batchNumber}}</td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Cantidad</th>
          <td mat-cell *matCellDef="let batch">{{batch.quantity}}</td>
        </ng-container>

        <ng-container matColumnDef="purchasePrice">
          <th mat-header-cell *matHeaderCellDef>Precio de Compra</th>
          <td mat-cell *matCellDef="let batch">{{batch.purchasePrice | currency}}</td>
        </ng-container>

        <ng-container matColumnDef="manufacturingDate">
          <th mat-header-cell *matHeaderCellDef>Fecha de Fabricación</th>
          <td mat-cell *matCellDef="let batch">{{batch.manufacturingDate | date}}</td>
        </ng-container>

        <ng-container matColumnDef="expirationDate">
          <th mat-header-cell *matHeaderCellDef>Fecha de Vencimiento</th>
          <td mat-cell *matCellDef="let batch">{{batch.expirationDate | date}}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let batch">
            <span [class]="'status-badge ' + batch.status">{{batch.status}}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let batch">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="onEditBatch(batch)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="onDeleteBatch(batch)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
