<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Facturas</mat-card-title>
      <div class="spacer"></div>
      <button mat-raised-button color="primary" (click)="addInvoice()">
        <mat-icon>add</mat-icon>
        Crear Factura
      </button>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="invoices" class="mat-elevation-z8">
        <ng-container matColumnDef="invoiceNumber">
          <th mat-header-cell *matHeaderCellDef>Número</th>
          <td mat-cell *matCellDef="let invoice">{{invoice.invoiceNumber}}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let invoice">{{invoice.date | date}}</td>
        </ng-container>

        <ng-container matColumnDef="customer">
          <th mat-header-cell *matHeaderCellDef>Cliente</th>
          <td mat-cell *matCellDef="let invoice">{{invoice.customer.name}}</td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let invoice">{{invoice.total | currency}}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let invoice">
            <span [class]="'status-badge ' + invoice.status">{{invoice.status}}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let invoice">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="editInvoice(invoice)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="accent" matTooltip="Ver" (click)="viewInvoice(invoice)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="deleteInvoice(invoice)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
